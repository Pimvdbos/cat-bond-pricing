name: Offline R software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - name: Offline artificial-fixture tests
        run: Rscript --vanilla tests/run_tests.R
      - name: Regenerate report-based figures
        run: Rscript --vanilla scripts/figures.R
